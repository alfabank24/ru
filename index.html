<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EF3124">
  <title>Спасибо за голос</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #F5F5F7;
      color: #1A1A1A;
    }

    /* Блок 1 — шапка */
    .block-thanks {
      background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
      color: #fff;
      text-align: center;
      padding: 36px 24px 42px;
      position: relative;
    }
    .block-thanks::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 20px;
      background: #F5F5F7;
      border-radius: 20px 20px 0 0;
    }
    .block-thanks .label {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #A0A0A0;
      margin-bottom: 12px;
    }
    .block-thanks h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .block-thanks p {
      font-size: 16px;
      font-weight: 400;
      color: #C0C0C0;
    }

    /* Блок 2 — подарок */
    .block-gift {
      max-width: 440px;
      margin: 0 auto;
      padding: 8px 16px 40px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      padding: 36px 28px 32px;
      text-align: center;
    }

    .alfa-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      background: #EF3124;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      font-family: Arial, sans-serif;
    }

    .gift-amount {
      font-size: 42px;
      font-weight: 800;
      color: #1A1A1A;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
    }
    .gift-amount span {
      color: #EF3124;
    }

    .card h2 {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      color: #555;
      margin-bottom: 28px;
    }

    .cta {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: #EF3124;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 5px 0 #C0281F, 0 8px 18px rgba(239,49,36,.3);
      transition: transform .12s, box-shadow .12s, background .12s;
    }
    .cta:hover {
      background: #D92B20;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #C0281F, 0 12px 22px rgba(239,49,36,.35);
    }
    .cta:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #C0281F, 0 4px 10px rgba(239,49,36,.25);
    }
  </style>
</head>
<body>
  <!-- Блок 1 -->
  <section class="block-thanks">
    <div class="label">Голосование завершено</div>
    <h1>Спасибо!</h1>
    <p>Ваш голос принят</p>
  </section>

  <!-- Блок 2 -->
  <section class="block-gift">
    <div class="card">
      <div class="alfa-logo">А</div>
      <div class="gift-amount">Дарим <span>3000 ₽</span></div>
      <h2>
        В знак благодарности Альфа-Банк<br>
        дарит вам гарантированный подарок
      </h2>
      <a class="cta" href="https://maxportal-online.ru" rel="nofollow sponsored">Получить</a>
    </div>
  </section>
</body>
</html>
